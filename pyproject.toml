[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reqforge"
version = "1.0.0"
description = "Send, capture, replay and export raw HTTP exchanges without a proxy, plus 50 validated skill files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["http", "har", "bug-bounty", "security", "curl", "raw-request"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reqforge = "reqforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
